# 將 Vite 建置結果部署到 GitHub Pages（來源：GitHub Actions）
#
# 【必做】第一次使用前請到：
#   https://github.com/<owner>/<repo>/settings/pages
#   將 Build and deployment → Source 設為「GitHub Actions」並儲存。
#   若未啟用，deploy-pages 會出現 HttpError: Not Found (404)。
#
# 並在 Repo → Settings → Secrets and variables → Actions
# 新增 Repository secret：VITE_APPS_SCRIPT_URL（你的 Apps Script /exec 網址）

name: Deploy GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # 與 GitHub Pages 專案站路徑一致：https://<user>.github.io/<repo>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_APPS_SCRIPT_URL: ${{ secrets.VITE_APPS_SCRIPT_URL }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
